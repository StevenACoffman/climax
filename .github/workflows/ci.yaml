name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOPRIVATE: "github.com/StevenACoffman"
  GOFLAGS: "-trimpath"
  GOLANGCI_LINT_VERSION: latest
permissions:
  contents: read
jobs:
  tidy:
    name: go mod tidy is committed
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        cache: true
    - run: go mod tidy
    - name: Fail if go.mod or go.sum changed
      run: |
        if ! git diff --exit-code go.mod go.sum; then
          echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
          exit 1
        fi

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The end-to-end suite builds throwaway repositories in t.TempDir(), but
        # `git worktree add` still needs this checkout to be a real repository
        # rather than a tarball export.
        fetch-depth: 0
        persist-credentials: false
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        cache: true
    - name: Vet
      run: go vet ./...
    - name: Run the suite with the race detector
      run: go test -race -count=1 ./...
    - name: Coverage report
      run: |
        go test -race -coverprofile=coverage.out -covermode=atomic ./...
        go tool cover -func=coverage.out | tail -1
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: coverage
        path: coverage.out
        retention-days: 7
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        cache: true
    - run: govulncheck ./...
