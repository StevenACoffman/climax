name: Mutation testing
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
jobs:
  mutate:
    name: Mutate changed lines
    runs-on: ubuntu-latest
    # A whole-module run is around 1600 mutants; a pull request's changed lines are a small
    # fraction of that. The ceiling is for a mutant that turns a loop infinite and is not
    # caught by mutago's own per-mutant timeout.
    timeout-minutes: 30
    # --logger-github writes ::warning lines to the log, which needs no token.
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # --git-diff-lines needs the base revision to diff against.
        fetch-depth: 0
        # Nothing after the checkout talks to the remote, so the token has no reason to
        # stay in .git/config while mutated pull-request code runs.
        persist-credentials: "false"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"
    - name: Install mutago
      # Pinned for the same reason benchgate is: a mutator added in a new release changes the
      # escape set on a pull request that changed nothing.
      run: go install github.com/quality-gates/mutago/v2/cmd/mutago@v2.10.22
    - name: Mutate the lines this pull request changed
      # Scoped to changed lines because mutating the whole module runs the suite once per
      # mutant, which is minutes of CI for a result nobody reads on an unrelated change.
      #
      # No --min-msi: a score floor needs a baseline this repository does not have yet, and a
      # gate that fails on arrival gets switched off rather than fixed. --logger-github
      # annotates surviving mutants on the diff instead, which is the part worth reading —
      # each one is a line the suite runs without checking. Add a floor once the escape set
      # has been looked at.
      #
      # -short skips pkg/scaffold's integration tests, which run `go mod tidy` and `go vet`
      # on a generated app: seconds each, per mutant, and network-dependent. A mutant only
      # those tests would catch shows up as escaped; check it with `go test` before
      # writing a test for it.
      #
      # On workflow_dispatch there is no pull request, so the base falls back to main.
      run: |
        mutago --git-diff-lines \
          --git-diff-base="${{ github.event.pull_request.base.sha || 'origin/main' }}" \
          --test-flags='-short' \
          --logger-github --quiet --no-diffs \
          ./pkg/... ./cmd/version/...
