name: Post-Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi-publish:
    name: Publish to PyPI
    environment: pypi
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Install gowheels
      run: go install github.com/StevenACoffman/gowheels@main

    - name: Build wheels and publish to PyPI
      run: gowheels pypi --name climax --package-name climaxgo --repo ${{ github.repository }} --upload
      env:
        GOWHEELS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
